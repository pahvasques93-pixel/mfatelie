<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF Ateliê Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=swap" rel="stylesheet">
<style>
/* Layout: the logo's blush as a sidebar ruled like a cutting mat, beside a quiet paper workspace; the logo's brown marks actions and what is selected. */
:root{
  --paper:#fbf6f2; --surface:#ffffff; --ink:#3a2218; --muted:#8a7166; --line:#ecdfd6;
  --mat:#f3ddd0; --mat-ink:#5a3220; --mat-line:rgba(90,50,32,.06); --mat-line-strong:rgba(90,50,32,.13);
  --blush:#f3ddd0; --blush-ink:#5a3220; --sel:#5a3220; --sel-ink:#fbeee6; --btn:#5a3220; --btn-ink:#ffffff;
  --good:#1d7a4f; --warn:#8f6000; --bad:#b93a32;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --body:"Albert Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1a1512; --surface:#241c18; --ink:#f1e6df; --muted:#b5a298; --line:#3b2f29;
  --mat:#2b201b; --mat-ink:#f3ddd0; --mat-line:rgba(243,221,208,.05); --mat-line-strong:rgba(243,221,208,.11);
  --blush:#f3ddd0; --blush-ink:#4a2a1c; --sel:#f3ddd0; --sel-ink:#3a2218; --btn:#8a5740; --btn-ink:#ffffff;
  --good:#4cc38a; --warn:#e0a93b; --bad:#f0736a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1a1512; --surface:#241c18; --ink:#f1e6df; --muted:#b5a298; --line:#3b2f29;
  --mat:#2b201b; --mat-ink:#f3ddd0; --mat-line:rgba(243,221,208,.05); --mat-line-strong:rgba(243,221,208,.11);
  --blush:#f3ddd0; --blush-ink:#4a2a1c; --sel:#f3ddd0; --sel-ink:#3a2218; --btn:#8a5740; --btn-ink:#ffffff;
  --good:#4cc38a; --warn:#e0a93b; --bad:#f0736a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.mat{background-color:var(--mat);color:var(--mat-ink);
  background-image:linear-gradient(var(--mat-line-strong) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line-strong) 1px,transparent 1px),linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  display:flex;flex-direction:column;gap:28px;padding:24px 16px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:64px;height:64px;border-radius:50%;flex:none;display:block;border:1px solid var(--mat-line-strong)}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1}
.brand span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--mat-ink);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:color-mix(in srgb,var(--mat-ink) 10%,transparent)}
nav a[aria-current="page"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.sync{margin-top:auto;font-size:12px;opacity:.8}
main{overflow:auto;padding:28px clamp(16px,4vw,40px) 56px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:14px;max-width:65ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.stepper button{border:0;background:none;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px}
.stepper button:hover{background:var(--paper)}
.stepper span{display:inline-block;min-width:124px;text-align:center;font-weight:600}
.stepper span::first-letter{text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile small{color:var(--muted);font-size:13px}
.tile strong{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile em{font-style:normal;color:var(--muted);font-size:12px}
.tile.saldo{outline:1.5px dashed color-mix(in srgb,var(--btn) 45%,transparent);outline-offset:-7px;padding:20px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
td.act .btn{margin-left:4px}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill i{font-style:normal;font-weight:700}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.none{color:var(--muted)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.banner{background:var(--blush);color:var(--blush-ink);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner .btn{background:transparent;border-color:var(--blush-ink);color:var(--blush-ink)}
.banner .btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.note{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
/* products */
.prod{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.prod-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.prod-top h2{font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fact small{display:block;color:var(--muted);font-size:12px}
.fact b{font-variant-numeric:tabular-nums;font-size:16px}
.comp{display:flex;gap:2px;height:14px}
.comp span{display:block;min-width:3px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prod-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
/* chart */
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:170px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plot{position:relative;height:170px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;gap:6px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50%}
.grp{display:flex;align-items:flex-end;gap:2px;height:100%;flex:1;justify-content:center;max-width:72px}
.bar{width:45%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px}
.grp.sel{background:color-mix(in srgb,var(--blush) 30%,transparent);border-radius:6px 6px 0 0}
.xax{grid-column:2;display:flex;justify-content:space-around;gap:6px;font-size:12px;color:var(--muted);padding-top:6px}
.xax span{flex:1;max-width:72px;text-align:center}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:6px 9px;border-radius:6px;max-width:240px;display:none;white-space:pre-line}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,15,13,.5)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:22px}
dialog h2{font-family:var(--display);font-size:24px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field input,.field select,.ficha select,.ficha input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.preview{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;min-height:1em}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:60;max-width:calc(100vw - 32px)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .mat{flex-direction:row;align-items:center;gap:14px;padding:10px 16px;overflow-x:auto}
  .brand span,.sync{display:none}
  .mono{width:40px;height:40px}
  .brand b{display:none}
  nav{flex-direction:row}
  nav a{padding:7px 11px}
  main{padding-top:20px}
  h1{font-size:28px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn,nav a{transition:background .15s,filter .15s,border-color .15s}}
</style>
</head>

var $=function(id){return document.getElementById(id)};
var view=$("view"),dlg=$("dlg"),form=$("dlgForm");

/* ---------- helpers ---------- */
function pad(n){return (n<10?"0":"")+n}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){var d=new Date();return ym(d)+"-"+pad(d.getDate())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function money(n){return BRL.format(isFinite(n)?n:0)}
function num(n,d){return (isFinite(n)?n:0).toLocaleString("pt-BR",{maximumFractionDigits:d==null?2:d})}
function parseNum(v){v=String(v==null?"":v).trim().replace(/[^\d.,-]/g,"");if(!v)return NaN;if(v.indexOf(",")>=0)v=v.replace(/\./g,"").replace(",",".");return parseFloat(v)}
function n0(v){v=Number(v);return isFinite(v)?v:0}
function fmtDate(s){var p=String(s||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:esc(s)}
function monthName(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}
function monthShort(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".","")+"/"+p[0].slice(2)}
function addMonth(k,d){var p=k.split("-");return ym(new Date(+p[0],+p[1]-1+d,1))}
function inMonth(list,k){return list.filter(function(x){return String(x.data||"").slice(0,7)===k})}
function sum(list,f){return list.reduce(function(a,x){return a+n0(f(x))},0)}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function newId(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){var t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},4000)}

/* ---------- pricing ---------- */
function cfg(){var c=S.config||{};return {proLabore:n0(c.proLabore),horasMes:n0(c.horasMes),taxa:n0(c.taxa),margem:n0(c.margem),fixos:Array.isArray(c.fixos)?c.fixos:[]}}
function rates(){var c=cfg(),fix=sum(c.fixos,function(f){return f.valor});var h=c.horasMes>0?c.horasMes:0;
  return {c:c,fixos:fix,hora:h?c.proLabore/h:0,fixoHora:h?fix/h:0}}
function custoUnit(m){var q=n0(m&&m.qtdComprada);return q>0?n0(m.precoPago)/q:0}
function calc(p,r){r=r||rates();var ficha=Array.isArray(p.ficha)?p.ficha:[];
  var mat=sum(ficha,function(l){var m=byId(S.materiais,l.materialId);return m?n0(l.qtd)*custoUnit(m):0});
  var mo=n0(p.tempoMin)/60*r.hora,fx=n0(p.tempoMin)/60*r.fixoHora,custo=mat+mo+fx;
  var t=r.c.taxa,mg=r.c.margem,minimo=t<1?custo/(1-t):custo,sugerido=(1-t-mg)>0?custo/(1-t-mg):NaN;
  var preco=n0(p.preco),lucro=preco*(1-t)-custo,st;
  if(!(preco>0))st="none";else if(preco<minimo-0.005)st="bad";else if(isFinite(sugerido)&&preco<sugerido-0.005)st="warn";else st="good";
  return {mat:mat,mo:mo,fx:fx,custo:custo,minimo:minimo,sugerido:sugerido,preco:preco,lucro:lucro,margem:preco>0?lucro/preco:0,st:st}}
var ST={good:["✓","Saudável"],warn:["!","Abaixo do ideal"],bad:["✕","Prejuízo"],none:["–","Definir preço"]};
function pill(st){return '<span class="pill '+st+'"><i aria-hidden="true">'+ST[st][0]+"</i>"+ST[st][1]+"</span>"}
function vendidas(pid){return sum(S.vendas.filter(function(v){return v.produtoId===pid}),function(v){return v.qtd})}
function estoque(p){return n0(p.produzidas)-vendidas(p.id)}

/* ---------- store ---------- */
function fail(e){var c=e&&e.code;toast(c==="invalid_argument"?"Não foi possível salvar: seu acesso é só de leitura.":c==="quota_exceeded"?"O limite de registros foi atingido. Apague lançamentos antigos.":"Não foi possível salvar. Verifique a conexão e tente de novo.")}
function localSet(col,id,data){var row=Object.assign({id:id},data),i=S[col].findIndex(function(x){return x.id===id});if(i>=0)S[col][i]=row;else S[col].push(row)}
function chk(r){if(r&&r.error)throw r.error;return r}
function saveDoc(col,id,data){
  if(db){var ref=id?db.collection(col).doc(id):db.collection(col).doc();return ref.set(data).then(function(){return ref.id})}
  id=id||newId();localSet(col,id,data);schedule();
  if(supa)return supa.from(T).upsert({user_id:uid,colecao:col,id:id,dados:data},{onConflict:"user_id,colecao,id"}).then(chk).then(function(){return id});
  persist();return Promise.resolve(id)}
function delDoc(col,id){
  if(db)return db.collection(col).doc(id).delete();
  S[col]=S[col].filter(function(x){return x.id!==id});schedule();
  if(supa)return supa.from(T).delete().eq("colecao",col).eq("id",id).then(chk);
  persist();return Promise.resolve()}
function saveConfig(c){if(db)return db.doc("config/main").set(c);S.config=c;schedule();
  if(supa)return supa.from(T).upsert({user_id:uid,colecao:"config",id:"main",dados:c},{onConflict:"user_id,colecao,id"}).then(chk);
  persist();return Promise.resolve()}
function pushAll(){var rows=[];if(S.config)rows.push({user_id:uid,colecao:"config",id:"main",dados:S.config});
  COLS.forEach(function(c){S[c].forEach(function(x){rows.push({user_id:uid,colecao:c,id:x.id,dados:strip(x)})})});
  return rows.length?supa.from(T).upsert(rows,{onConflict:"user_id,colecao,id"}).then(chk):Promise.resolve()}
function fetchAll(){return supa.from(T).select("colecao,id,dados").then(chk).then(function(r){
  var o={config:null};COLS.forEach(function(c){o[c]=[]});
  (r.data||[]).forEach(function(x){if(x.colecao==="config")o.config=x.dados;else if(o[x.colecao])o[x.colecao].push(Object.assign({id:x.id},x.dados))});
  adopt(o);S.mode="supa";S.slow=false;schedule()})}
function localCopy(){try{var o=JSON.parse(localStorage.getItem(KEY)||"null");return o&&(o.config||COLS.some(function(c){return Array.isArray(o[c])&&o[c].length}))?o:null}catch(e){return null}}
function bootSupa(conf){
  S.mode="loading";render();
  var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
  s.onerror=function(){S.mode="error";render()};
  s.onload=function(){
    supa=window.supabase.createClient(conf.url,conf.anonKey);
    supa.auth.onAuthStateChange(function(ev,session){
      var id=session&&session.user?session.user.id:null;
      if(id===uid&&ev!=="SIGNED_OUT")return;
      uid=id;email=session&&session.user?session.user.email||"":"";
      if(!uid){adopt({});S.mode="auth";render();return}
      S.mode="loading";render();setTimeout(function(){fetchAll().catch(function(){S.mode="error";schedule()})},0)});
    supa.auth.getSession().then(function(r){if(!(r.data&&r.data.session)&&S.mode==="loading"){S.mode="auth";render()}})};
  document.head.appendChild(s);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&uid&&S.mode==="supa"&&!dlg.open)fetchAll().catch(function(){})});
}
var KEY="mf-atelie-gestao-v1";
function persist(){try{localStorage.setItem(KEY,JSON.stringify({config:S.config,materiais:S.materiais,produtos:S.produtos,vendas:S.vendas,despesas:S.despesas}));S.persist=true}catch(e){S.persist=false}}
function adopt(o){if(!o||typeof o!=="object")return false;S.config=o.config&&typeof o.config==="object"?o.config:null;
  COLS.forEach(function(c){S[c]=Array.isArray(o[c])?o[c].filter(function(x){return x&&typeof x==="object"&&x.id}):[]});return true}
function loadLocal(){try{var raw=localStorage.getItem(KEY);if(raw)adopt(JSON.parse(raw));localStorage.setItem(KEY+"-t","1");S.persist=true}catch(e){S.persist=false}}
var EXEMPLOS={config:{proLabore:2000,horasMes:80,taxa:0.04,margem:0.2,fixos:[{nome:"MEI (DAS)",valor:82},{nome:"Energia",valor:50},{nome:"Internet / celular",valor:40},{nome:"Manutenção da máquina",valor:30},{nome:"Linhas, agulhas e aviamentos gerais",valor:40}]},
  materiais:[{id:"m1",nome:"Tricoline estampada",unidade:"m",precoPago:32,qtdComprada:1},{id:"m2",nome:"Tricoline lisa",unidade:"m",precoPago:26,qtdComprada:1},{id:"m3",nome:"Manta acrílica",unidade:"m",precoPago:14,qtdComprada:1},{id:"m4",nome:"Viés de algodão (rolo)",unidade:"m",precoPago:22,qtdComprada:20},{id:"m5",nome:"Embalagem (saquinho + tag)",unidade:"un",precoPago:60,qtdComprada:50}],
  produtos:[{id:"p1",nome:"Jogo americano",tempoMin:30,preco:35,produzidas:12,ficha:[{materialId:"m1",qtd:0.12},{materialId:"m2",qtd:0.12},{materialId:"m3",qtd:0.12},{materialId:"m5",qtd:1}]},
    {id:"p2",nome:"Guardanapo de tecido",tempoMin:15,preco:15,produzidas:12,ficha:[{materialId:"m1",qtd:0.15},{materialId:"m5",qtd:1}]},
    {id:"p3",nome:"Porta-guardanapo",tempoMin:15,preco:10,produzidas:10,ficha:[{materialId:"m1",qtd:0.05},{materialId:"m3",qtd:0.05},{materialId:"m5",qtd:1}]},
    {id:"p4",nome:"Trilho de mesa natalino",tempoMin:60,preco:90,produzidas:3,ficha:[{materialId:"m1",qtd:0.45},{materialId:"m2",qtd:0.45},{materialId:"m3",qtd:0.45},{materialId:"m4",qtd:4},{materialId:"m5",qtd:1}]}],
  vendas:[{id:"v1",data:"2026-11-07",produtoId:"p1",produtoNome:"Jogo americano",qtd:4,valor:140,pagamento:"Pix",obs:"Feira de Natal"},{id:"v2",data:"2026-11-07",produtoId:"p2",produtoNome:"Guardanapo de tecido",qtd:6,valor:90,pagamento:"Dinheiro",obs:"Feira de Natal"},{id:"v3",data:"2026-11-10",produtoId:"p4",produtoNome:"Trilho de mesa natalino",qtd:1,valor:90,pagamento:"Cartão de crédito",obs:"Encomenda pelo Instagram"},{id:"v4",data:"2026-11-14",produtoId:"p3",produtoNome:"Porta-guardanapo",qtd:6,valor:60,pagamento:"Pix",obs:""}],
  despesas:[{id:"d1",data:"2026-11-03",descricao:"Tecidos natalinos",categoria:"Materiais",valor:180,pagamento:"Pix",obs:""},{id:"d2",data:"2026-11-05",descricao:"Saquinhos e tags",categoria:"Embalagem",valor:60,pagamento:"Pix",obs:""},{id:"d3",data:"2026-11-06",descricao:"Taxa da feira",categoria:"Feiras e eventos",valor:80,pagamento:"Dinheiro",obs:""},{id:"d4",data:"2026-11-10",descricao:"MEI (DAS)",categoria:"Impostos e taxas",valor:82,pagamento:"Pix",obs:""}]};
function loadExemplos(){var o=JSON.parse(JSON.stringify(EXEMPLOS));COLS.forEach(function(c){o[c].forEach(function(x){x.exemplo=true})});adopt(o);S.month="2026-11";schedule();
  if(supa)pushAll().catch(fail);else persist()}
function strip(o){var r={};for(var k in o)if(k!=="id")r[k]=o[k];return r}
function got(key,fromCache){S.loaded[key]=S.loaded[key]||!fromCache;
  if(COLS.concat("config").every(function(k){return S.loaded[k]})){clearTimeout(timer);S.slow=false;S.mode="live"}
  schedule()}
function onErr(){clearTimeout(timer);S.mode="error";schedule()}
function boot(){
  var sc=window.MF_SUPABASE;if(sc&&sc.url&&sc.anonKey){bootSupa(sc);return}
  render();
  var use=window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null);
  Promise.resolve(use).catch(function(){return null}).then(function(api){
    if(!api){S.mode="local";loadLocal();render();return}
    db=api;timer=setTimeout(function(){S.slow=true;schedule()},10000);
    COLS.forEach(function(c){db.collection(c).onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});got(c,snap.metadata.fromCache)},onErr)});
    db.doc("config/main").onSnapshot(function(snap){S.config=snap.exists?snap.data():null;got("config",snap.metadata.fromCache)},onErr);
  });
}
function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render()})}

/* ---------- views ---------- */
function route(){var h=location.hash.replace("#","");return VIEWS.indexOf(h)>=0?h:"painel"}
function stepper(){return '<div class="stepper"><button type="button" data-a="month" data-d="-1" aria-label="Mês anterior">‹</button><span>'+esc(monthName(S.month))+'</span><button type="button" data-a="month" data-d="1" aria-label="Próximo mês">›</button></div>'}
function delBtn(col,id){var k=col+"/"+id,on=S.armed===k;return '<button type="button" class="btn small danger'+(on?" armed":"")+'" data-a="del" data-col="'+col+'" data-id="'+esc(id)+'">'+(on?"Confirmar":"Excluir")+"</button>"}
function notices(){var h="";
  if(S.mode==="local"&&!S.persist)h+='<div class="note">Este navegador não permite guardar dados. O que você lançar agora vale só enquanto esta página estiver aberta.</div>';
  var vazio=!S.config&&COLS.every(function(c){return !S[c].length});
  if(S.mode==="supa"&&vazio&&localCopy())h+='<div class="banner"><span><b>Há dados guardados neste navegador.</b> Quer enviá-los para a sua conta?</span><button type="button" class="btn small" data-a="sobelocal">Enviar para a conta</button></div>';
  if((S.mode==="local"||S.mode==="supa")&&vazio)h+='<div class="banner"><span><b>Tudo em branco por aqui.</b> Comece pelos Ajustes e pelos Materiais, ou carregue dados de exemplo para conhecer o sistema.</span><button type="button" class="btn small" data-a="exemplos">Carregar exemplos</button></div>';
  if(S.mode==="error")h+='<div class="note">Não foi possível conectar aos dados. Verifique a internet e recarregue a página.</div>';
  if(S.slow)h+='<div class="note">Os dados ainda não chegaram. O que aparece aqui pode estar desatualizado.</div>';
  var ex=COLS.some(function(c){return S[c].some(function(x){return x.exemplo})});
  if(ex)h+='<div class="banner"><span><b>Dados de exemplo.</b> Os lançamentos, produtos e materiais abaixo são ilustrativos. Apague quando for começar de verdade.</span><button type="button" class="btn small'+(S.armed==="exemplos"?" armed":"")+'" data-a="clear">'+(S.armed==="exemplos"?"Confirmar: apagar exemplos":"Apagar exemplos")+"</button></div>";
  return h}

function vPainel(){
  var ve=inMonth(S.vendas,S.month),de=inMonth(S.despesas,S.month),ent=sum(ve,function(v){return v.valor}),sai=sum(de,function(d){return d.valor}),saldo=ent-sai;
  var r=rates(),pecas=sum(S.produtos,estoque),valEst=sum(S.produtos,function(p){return Math.max(0,estoque(p))*n0(p.preco)});
  var h='<div class="head"><div><h1>Painel</h1><p class="sub">Como o ateliê foi em '+esc(monthName(S.month))+".</p></div>"+stepper()+"</div>"+notices();
  h+='<div class="tiles"><div class="tile"><small>Entradas</small><strong>'+money(ent)+"</strong><em>"+num(sum(ve,function(v){return v.qtd}),0)+" peças vendidas</em></div>"+
     '<div class="tile"><small>Saídas</small><strong>'+money(sai)+"</strong><em>"+de.length+" despesas</em></div>"+
     '<div class="tile saldo"><small>Saldo do mês</small><strong class="'+(saldo<0?"neg":"pos")+'">'+money(saldo)+"</strong><em>entradas menos saídas</em></div>"+
     '<div class="tile"><small>Em estoque</small><strong>'+num(pecas,0)+" peças</strong><em>"+money(valEst)+" a preço de venda</em></div></div>";
  /* chart */
  var ms=[],i;for(i=5;i>=0;i--)ms.push(addMonth(S.month,-i));
  var data=ms.map(function(k){return {k:k,e:sum(inMonth(S.vendas,k),function(v){return v.valor}),s:sum(inMonth(S.despesas,k),function(d){return d.valor})}});
  var mx=Math.max.apply(null,data.map(function(d){return Math.max(d.e,d.s)})),top=niceMax(mx);
  h+='<div class="card"><div class="prod-top"><h2>Entradas e saídas, últimos 6 meses</h2><div class="legend"><span><i style="background:var(--s1)"></i>Entradas</span><span><i style="background:var(--s2)"></i>Saídas</span></div></div>';
  h+='<div class="chart"><div class="yax"><span>'+money(top)+"</span><span>"+money(top/2)+'</span><span>R$ 0</span></div><div class="plot">'+data.map(function(d){
    return '<div class="grp'+(d.k===S.month?" sel":"")+'"><div class="bar" style="height:'+(d.e/top*100)+'%;background:var(--s1)" data-tip="'+esc(monthName(d.k))+"\nEntradas: "+money(d.e)+'"></div><div class="bar" style="height:'+(d.s/top*100)+'%;background:var(--s2)" data-tip="'+esc(monthName(d.k))+"\nSaídas: "+money(d.s)+'"></div></div>'}).join("")+
    '</div><div class="xax">'+data.map(function(d){return "<span>"+esc(monthShort(d.k))+"</span>"}).join("")+"</div></div></div>";
  /* attention + recent */
  var att=S.produtos.map(function(p){return {p:p,c:calc(p,r)}}).filter(function(x){return x.c.st!=="good"});
  h+='<div class="cols"><div class="card"><h2>Preços para rever</h2>'+(att.length?'<div class="tablebox"><table><tbody>'+att.map(function(x){
      return "<tr><td>"+esc(x.p.nome)+"<br><small class=\"sub\">cobra "+(x.c.preco>0?money(x.c.preco):"—")+" · sugerido "+money(x.c.sugerido)+'</small></td><td class="act">'+pill(x.c.st)+"</td></tr>"}).join("")+"</tbody></table></div>"
    :'<p class="empty">'+(S.produtos.length?"Todos os preços cobrem custos, sua hora e a margem.":"Cadastre produtos para ver a saúde dos preços.")+"</p>")+
    '<div><a class="btn small" href="#produtos">Abrir produtos e preços</a></div></div>';
  var rec=S.vendas.map(function(v){return {d:v.data,t:(v.produtoNome||"Venda")+" × "+num(v.qtd,0),v:n0(v.valor)}}).concat(S.despesas.map(function(d){return {d:d.data,t:d.descricao||"Despesa",v:-n0(d.valor)}}))
    .sort(function(a,b){return String(b.d).localeCompare(String(a.d))}).slice(0,6);
  h+='<div class="card"><h2>Últimos lançamentos</h2>'+(rec.length?'<div class="tablebox"><table><tbody>'+rec.map(function(x){
      return "<tr><td>"+fmtDate(x.d)+"</td><td>"+esc(x.t)+'</td><td class="num '+(x.v<0?"neg":"pos")+'">'+(x.v<0?"− ":"+ ")+money(Math.abs(x.v))+"</td></tr>"}).join("")+"</tbody></table></div>"
    :'<p class="empty">Nenhum lançamento ainda.</p>')+
    '<div class="actions" style="justify-content:flex-start"><button type="button" class="btn small primary" data-a="venda">Registrar venda</button><button type="button" class="btn small" data-a="despesa">Registrar despesa</button></div></div></div>';
  return h}
function niceMax(v){if(!(v>0))return 100;var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

function vVendas(){
  var list=inMonth(S.vendas,S.month).sort(function(a,b){return String(b.data).localeCompare(String(a.data))});
  var h='<div class="head"><div><h1>Vendas</h1><p class="sub">Cada venda entra no caixa e baixa o estoque do produto.</p></div><div class="actions">'+stepper()+'<button type="button" class="btn primary" data-a="venda">Registrar venda</button></div></div>'+notices();
  h+='<div class="card">'+(list.length?'<div class="tablebox"><table><thead><tr><th>Data</th><th>Produto</th><th class="num">Qtd</th><th class="num">Valor</th><th>Pagamento</th><th>Cliente / obs.</th><th></th></tr></thead><tbody>'+list.map(function(v){
    return "<tr><td>"+fmtDate(v.data)+"</td><td>"+esc(v.produtoNome)+'</td><td class="num">'+num(v.qtd,0)+'</td><td class="num">'+money(n0(v.valor))+'</td><td><span class="tag">'+esc(v.pagamento)+"</span></td><td>"+esc(v.obs)+'</td><td class="act"><button type="button" class="btn small" data-a="venda" data-id="'+esc(v.id)+'">Editar</button>'+delBtn("vendas",v.id)+"</td></tr>"}).join("")+
    '</tbody><tfoot><tr><td colspan="2">Total do mês</td><td class="num">'+num(sum(list,function(v){return v.qtd}),0)+'</td><td class="num">'+money(sum(list,function(v){return v.valor}))+'</td><td colspan="3"></td></tr></tfoot></table></div>'
    :'<p class="empty">Nenhuma venda em '+esc(monthName(S.month))+".</p>")+"</div>";
  return h}

function vDespesas(){

  var h='<div class="head"><div><h1>Despesas</h1><p class="sub">Tudo o que sai do caixa: tecidos, embalagens, feiras, impostos.</p></div><div class="actions">'+stepper()+'<button type="button" class="btn primary" data-a="despesa">Registrar despesa</button></div></div>'+notices();

function field(id,label,type,value,extra){extra=extra||{};
  var h='<div class="field"><label for="f_'+id+'">'+esc(label)+"</label>";
  if(type==="select")h+='<select id="f_'+id+'" name="'+id+'">'+extra.options.map(function(o){var val=Array.isArray(o)?o[0]:o,txt=Array.isArray(o)?o[1]:o;return '<option value="'+esc(val)+'"'+(String(val)===String(value)?" selected":"")+">"+esc(txt)+"</option>"}).join("")+"</select>";
  else h+='<input id="f_'+id+'" name="'+id+'" type="'+(type==="date"?"date":"text")+'"'+(type==="num"?' inputmode="decimal"':"")+' value="'+esc(value==null?"":value)+'" autocomplete="off">';
  if(extra.hint)h+="<small>"+esc(extra.hint)+"</small>";
  return h+"</div>"}
function nv(n){return n==null||n===""||!isFinite(n)?"":String(n).replace(".",",")}
function open(title,body,onSubmit,after){
  form.innerHTML="<h2>"+esc(title)+"</h2>"+body+'<div class="err" id="f_err" role="alert"></div><div class="actions"><button type="button" class="btn" data-a="close">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>';
  form.onsubmit=function(e){e.preventDefault();var err;try{err=onSubmit(form.elements)}catch(x){err="Confira os campos e tente de novo."}
    if(typeof err==="string"){$("f_err").textContent=err;return}
    dlg.close();if(err&&err.then)err.catch(fail)};
  if(after)after();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}

  if(a==="close"){dlg.close();return}
  if(a==="addficha"){$("f_ficha").insertAdjacentHTML("beforeend",fichaRow());return}
  if(a==="rmficha"){b.closest(".ficha").remove();if(form._preview)form._preview();return}
  if(a==="month"){S.month=addMonth(S.month,+b.dataset.d);schedule();return}
  if(a==="venda")return dlgVenda(id);
  if(a==="despesa")return dlgDespesa(id);
  if(a==="material")return dlgMaterial(id);
  if(a==="produto")return dlgProduto(id);
  if(a==="producao")return dlgProducao(id);
  if(a==="params")return dlgParams();
  if(a==="fixo")return dlgFixo(b.dataset.i!=null?+b.dataset.i:null);
  if(a==="del"){var k=b.dataset.col+"/"+id;if(S.armed!==k)return arm(k);S.armed=null;delDoc(b.dataset.col,id).catch(fail);schedule();return}
  if(a==="delfixo"){var kf="fixo/"+b.dataset.i;if(S.armed!==kf)return arm(kf);S.armed=null;var c=cfg(),fx=c.fixos.slice();fx.splice(+b.dataset.i,1);
    saveConfig({proLabore:c.proLabore,horasMes:c.horasMes,taxa:c.taxa,margem:c.margem,fixos:fx}).catch(fail);schedule();return}
  if(a==="exemplos"){loadExemplos();return}
  if(a==="sair"){supa.auth.signOut();return}
  if(a==="sobelocal"){var lc=localCopy();if(lc){adopt(lc);schedule();pushAll().then(function(){toast("Dados enviados para a conta.")}).catch(fail)}return}
  if(a==="export"){try{var blob=new Blob([JSON.stringify({config:S.config,materiais:S.materiais,produtos:S.produtos,vendas:S.vendas,despesas:S.despesas},null,1)],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");
      l.href=u;l.download="mf-atelie-backup-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(x){toast("Não foi possível gerar o arquivo neste navegador.")}return}
  if(a==="import"){var fi=$("f_import");fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();
      rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!Array.isArray(o.produtos)||!Array.isArray(o.vendas))throw 0;adopt(o);persist();schedule();toast("Dados restaurados.")}catch(x){toast("Este arquivo não é uma cópia de segurança do sistema.")}};rd.readAsText(f)};fi.click();return}
  if(a==="clear"){if(S.armed!=="exemplos")return arm("exemplos");S.armed=null;
    var jobs=[];COLS.forEach(function(c){S[c].filter(function(x){return x.exemplo}).forEach(function(x){jobs.push([c,x.id])})});
    jobs.reduce(function(p,j){return p.then(function(){return delDoc(j[0],j[1])})},Promise.resolve()).then(function(){toast("Exemplos apagados.")}).catch(fail);return}
});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
document.addEventListener("submit",function(e){
  if(e.target.id!=="authForm")return;e.preventDefault();
  var f=e.target,up=e.submitter&&e.submitter.dataset.auth==="up",em=f.elements.email.value.trim(),pw=f.elements.senha.value,er=$("a_err");
  if(!em||!pw){er.textContent="Informe e-mail e senha.";return}
  if(up&&pw.length<6){er.textContent="A senha precisa ter pelo menos 6 caracteres.";return}
  er.textContent="Aguarde…";
  (up?supa.auth.signUp({email:em,password:pw}):supa.auth.signInWithPassword({email:em,password:pw})).then(function(r){
    if(r.error){er.textContent=up?"Não foi possível criar a conta: "+r.error.message:"E-mail ou senha incorretos.";return}
    if(up&&!(r.data&&r.data.session))er.textContent="Conta criada. Abra o e-mail de confirmação que enviamos e depois clique em Entrar.";
  }).catch(function(){er.textContent="Sem conexão. Tente de novo."})});
dlg.addEventListener("close",function(){form._preview=null});
var tip=$("tip");
document.addEventListener("mousemove",function(e){var t=e.target.closest&&e.target.closest("[data-tip]");
  if(!t){tip.style.display="none";return}
  tip.textContent=t.dataset.tip;tip.style.display="block";
  var x=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-8),y=e.clientY+14;if(y+tip.offsetHeight>window.innerHeight-8)y=e.clientY-tip.offsetHeight-10;
  tip.style.left=Math.max(8,x)+"px";tip.style.top=y+"px"});
window.addEventListener("hashchange",function(){S.armed=null;render();document.querySelector("main").scrollTop=0});
boot();
})();
</script>
